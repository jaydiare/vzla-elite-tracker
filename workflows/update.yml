name: Daily Athlete Sync
on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 4 AM UTC
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Data
        env:
          # Critical: This maps your GitHub Secrets to the environment
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python fetch_data.py

      - name: Save & Deploy Changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/athletes.json
          # Prevents push errors if no data has changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update athlete data" && git push)