name: Update Fanatics averages (weekly)

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

concurrency:
  group: fanatics-avg-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        if: hashFiles('package-lock.json') != ''

      - name: Update Fanatics averages
        run: node scripts/update-fanatics-avg.js
        env:
          FANATICS_SCRAPE: ${{ secrets.FANATICS_SCRAPE }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/fanatics-avg.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Fanatics averages"
          git push origin main
