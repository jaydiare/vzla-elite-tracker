# .github/workflows/update-ebay-sold-median.yml
name: Update eBay sold median (Topps/Panini)

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 03:30 UTC (change if you want)
    #- cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-ebay-sold-median
  cancel-in-progress: false

jobs:
  update-ebay-sold-median:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run sold median script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/update-ebay-sold-median.js

      - name: Commit updated sold median data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ebay-sold-median.json
          git commit -m "chore: update eBay sold median data" || echo "No changes to commit"
          git push
