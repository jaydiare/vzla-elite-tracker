name: Update eBay averages

on:
  schedule:
    - cron: "0 0,12 * * *"   # twice daily UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        if: hashFiles('package-lock.json') != ''

      - run: node scripts/update-ebay-avg.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ebay-avg.json
          git commit -m "Update eBay sold averages" || echo "No changes"
          git push
