name: Automated Athlete Sync

on:
  workflow_dispatch: # Keeps the manual button
  schedule:
    - cron: '0 8,20 * * *' # Runs twice a day (8am and 8pm UTC)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important for pushing data back
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
        run: python fetch_all_vzla.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/athletes.json
          git commit -m "Automated sync: Updated Venezuelan athletes" || echo "No changes to commit"
          git push
