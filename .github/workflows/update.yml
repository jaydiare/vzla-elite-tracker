name: Manual Athlete Sync

on:
  workflow_dispatch: # This enables the manual "Run workflow" button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Fetch Script
        env:
          API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }} # Set this in GitHub Settings > Secrets
        run: python fetch_all_vzla.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/athletes.json
          git commit -m "Manual sync: Updated Venezuelan athletes" || echo "No changes to commit"
          git push
