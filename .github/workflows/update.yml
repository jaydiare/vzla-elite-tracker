name: Automated Athlete Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

# ✅ Prevent overlapping runs (manual + scheduled) from racing and causing push rejects
concurrency:
  group: athlete-sync-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ✅ needed for rebase/pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python scripts/fetch_all_vzla.py

      - name: Commit and Push changes
        run: |
          set -e

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Add outputs (cache may not exist on first run)
          git add data/athletes.json data/tsdb_cache.json || true

          # Only commit/push if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automated sync: Updated Venezuelan athletes"

          # ✅ Avoid "fetch first" by rebasing on the latest remote main
          git fetch origin main
          git rebase origin/main || (git rebase --abort && git pull --rebase origin main)

          # ✅ Push updated history
          git push origin HEAD:main
