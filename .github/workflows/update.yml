name: Automated Athlete Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Fetch Script
        env:
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python fetch_all_vzla.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Add outputs (cache may not exist on first run)
          git add data/athletes.json data/tsdb_cache.json || true

          # Only commit/push if something actually changed
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Automated sync: Updated Venezuelan athletes"
          git push
