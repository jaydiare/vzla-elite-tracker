<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Athlete Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    
    <style>
        :root { --primary-color: #0033a0; --accent-color: #ffcc00; --danger-color: #ce1126; }
        body { background-color: #f4f7f6; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .hero { background: linear-gradient(135deg, var(--primary-color), #001e5a); color: white; padding: 4rem 0; margin-bottom: 2rem; }
        .card-athlete { border: none; border-radius: 15px; overflow: hidden; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-athlete:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-container { height: 220px; overflow: hidden; background-color: #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .btn-ebay { background-color: var(--accent-color); color: #000; font-weight: 600; border: none; }
        .btn-ebay:hover { background-color: #e6b800; }
        .view-toggle { cursor: pointer; padding: 10px 20px; }
    </style>
</head>
<body>

<header class="hero text-center">
    <div class="container">
        <h1 id="main-title" class="display-4 fw-bold mb-2">🇻🇪 Atletas Elite</h1>
        <p class="lead opacity-75">Tracking professional talent across global leagues</p>
        <span id="update-badge" class="badge rounded-pill bg-light text-dark">Syncing...</span>
    </div>
</header>

<main class="container mb-5">
    <div class="card shadow-sm border-0 p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchBar" class="form-control" placeholder="Search athlete or team..." onkeyup="filterContent()">
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group" id="sport-filters">
                    </div>
                <div class="ms-2 d-inline-block border-start ps-3">
                    <button class="btn btn-outline-dark" onclick="switchView('grid')"><i class="fas fa-th"></i></button>
                    <button class="btn btn-outline-dark" onclick="switchView('table')"><i class="fas fa-list"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="grid-view" class="row g-4"></div>

    <div id="table-view" class="d-none card shadow-sm p-4">
        <table id="statsTable" class="table table-hover w-100">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Sport</th>
                    <th>League</th>
                    <th>Team</th>
                    <th>Shop</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
let athleteData = [];
let config = {};
let currentSport = 'All';

async function init() {
    try {
        const configResp = await fetch('config.json');
        config = await configResp.json();
        
        const dataResp = await fetch('data/athletes.json');
        athleteData = await dataResp.json();
        
        document.title = config.site_title;
        document.getElementById('main-title').innerText = `${config.country_flag} ${config.site_title}`;
        document.getElementById('update-badge').innerText = `Last Update: ${new Date().toLocaleDateString()}`;

        setupFilters();
        filterContent();
    } catch (e) { console.error("Initialization error", e); }
}

function setupFilters() {
    const sports = ['All', ...new Set(athleteData.map(a => a.sport))];
    const container = document.getElementById('sport-filters');
    container.innerHTML = sports.map(s => `
        <button class="btn btn-outline-primary ${s==='All'?'active':''}" onclick="setSport('${s}', this)">${s}</button>
    `).join('');
}

function setSport(sport, btn) {
    currentSport = sport;
    document.querySelectorAll('#sport-filters .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterContent();
}

function filterContent() {
    const term = document.getElementById('searchBar').value.toLowerCase();
    const filtered = athleteData.filter(a => {
        const matchSport = currentSport === 'All' || a.sport === currentSport;
        const matchTerm = a.name.toLowerCase().includes(term) || a.team.toLowerCase().includes(term);
        return matchSport && matchTerm;
    });
    renderGrid(filtered);
    renderTable(filtered);
}

function getEbayUrl(name) {
    return `https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(name)}&_ssn=${config.ebay_seller_id}`;
}

function renderGrid(data) {
    const grid = document.getElementById('grid-view');
    grid.innerHTML = data.map(a => `
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-athlete h-100 shadow-sm">
                <div class="img-container">
                    <img src="${a.img || 'https://via.placeholder.com/300x220?text=Athlete'}" alt="${a.name}">
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-2">
                        <h5 class="mb-0 fw-bold">${a.name}</h5>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle">${a.league}</span>
                    </div>
                    <p class="text-muted small mb-3"><i class="fas fa-university me-1"></i> ${a.team}</p>
                    <a href="${getEbayUrl(a.name)}" target="_blank" class="btn btn-ebay btn-sm w-100">
                        <i class="fab fa-ebay me-2"></i>Shop Collectibles
                    </a>
                </div>
            </div>
        </div>
    `).join('');
}

function renderTable(data) {
    if ($.fn.DataTable.isDataTable('#statsTable')) {
        $('#statsTable').DataTable().destroy();
    }
    const body = document.getElementById('table-body');
    body.innerHTML = data.map(a => `
        <tr>
            <td>${a.name}</td>
            <td>${a.sport}</td>
            <td>${a.league}</td>
            <td>${a.team}</td>
            <td><a href="${getEbayUrl(a.name)}" target="_blank" class="text-warning"><i class="fab fa-ebay fa-lg"></i></a></td>
        </tr>
    `).join('');
    $('#statsTable').DataTable({ responsive: true, dom: 'tp' });
}

function switchView(view) {
    document.getElementById('grid-view').classList.toggle('d-none', view === 'table');
    document.getElementById('table-view').classList.toggle('d-none', view === 'grid');
}

init();
</script>
</body>
</html>
