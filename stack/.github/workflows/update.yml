name: Daily Athlete Sync
on:
  schedule:
    - cron: '0 4 * * *' # Runs at 4 AM UTC daily
  workflow_dispatch: # Allows manual click to update

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Data
        env:
          # This connects your secret vault to the script
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
        run: python fetch_data.py

      - name: Save & Deploy
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/athletes.json
          # Only push if there are changes to avoid infinite loops
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update athlete data" && git push)