name: Daily Athlete & Store Sync
on:
  schedule:
    - cron: '0 2 * * *' # Runs at 2:00 AM daily
  workflow_dispatch: # Allows you to click a button to update manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Execute Sync Script
        env:
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          NBA_API_KEY: ${{ secrets.NBA_API_KEY }}
          SOCCER_API_KEY: ${{ secrets.SOCCER_API_KEY }}
        run: python fetch_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add data/athletes.json
          # Only commit if the data actually changed
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update athlete data & eBay links" && git push)