  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background-color: #0a0a0a; font-family: 'Inter', sans-serif; color: white; }

    .athlete-card {
      background: #121212;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      border: 1px solid rgba(242, 242, 13, 0.1);
      transition: all 0.3s ease;
    }
    .athlete-card:hover { transform: translateY(-5px); border-color: rgba(242, 242, 13, 0.4); }

    .sport-icon-wrapper {
      background: rgba(242, 242, 13, 0.03);
      border-radius: 24px;
      padding: 35px;
      margin-bottom: 24px;
      border: 1px solid rgba(242, 242, 13, 0.15);
    }

    .search-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto 2rem; }
    .search-input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 50px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #f2f20d; box-shadow: 0 0 10px rgba(242, 242, 13, 0.2); }

    .indicator-bar { display: flex; gap: 4px; justify-content: center; margin-top: 15px; }
    .active-segment { width: 28px; height: 5px; background: #f2f20d; border-radius: 3px; }
    .inactive-segment { width: 14px; height: 5px; background: #2a2a2a; border-radius: 3px; }
    .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: #00C848; }

    .fa-instagram:hover { color: #E4405F; }
    .fa-x-twitter:hover { color: #ffffff; }
    .fa-facebook:hover { color: #1877F2; }

    /* Spacer so content doesn't hide behind fixed footer */
    .footer-banner-spacer { height: 120px; }
    @media (max-width: 768px) {
      .footer-banner-spacer { height: 105px; }
    }

    /* Footer Banner */
    .ebay-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;

      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);

      display: flex;
      justify-content: center;

      padding: 10px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateZ(0);
    }

    .ebay-banner-img {
      width: min(970px, 96vw);
      height: auto;

      border-radius: 12px;
      display: block;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.2s ease;

      max-height: 72px;
      object-fit: contain;
    }

    @media (max-width: 480px) {
      .ebay-banner-img {
        max-height: 56px;
        width: 96vw;
      }
    }

    .ebay-banner-img:hover { transform: scale(1.01); }

    /* ✅ Cookie banner (positioned above footer banner) */
    .cookie-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 110px; /* above footer */
      z-index: 10000;

      background: rgba(18,18,18,0.96);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 14px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      display: none;
    }

    @media (min-width: 768px) {
      .cookie-banner {
        left: auto;
        right: 24px;
        width: 420px;
        bottom: 120px;
      }
    }

    .cookie-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .cookie-btn {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #1a1a1a;
      color: white;
    }

    .cookie-btn-accept {
      background: #f2f20d;
      color: #000;
      border-color: rgba(242,242,13,0.4);
    }

    .cookie-link {
      color: rgba(242,242,13,0.95);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <header class="bg-[#f2f20d] text-black px-6 py-2 flex justify-between items-center text-[10px] font-black uppercase tracking-tighter">
    <span>© 2026 VZLA Sports Elite</span>

  <nav class="p-6 border-b border-white/5 flex items-center justify-between sticky top-0 bg-black/80 backdrop-blur-md z-50">

    <div class="flex gap-4 text-[10px] font-black uppercase tracking-widest px-2 md:px-0" id="sport-filters">

  <main class="max-w-7xl mx-auto p-8">

        <br>
        <span class="text-3xl lowercase font-bold text-slate-300">search for their memorabilia</span>
      </h2>

      <div class="flex flex-col items-center gap-4">
        <p class="text-slate-400 font-bold">
          by <a href="https://www.ebay.ca/str/localherossportscards?mkcid=1&mkrid=706-53473-19255-0&siteid=2&campid=5339142305&customid=&toolid=10001&mkevt=1"
                target="_blank"
                class="text-[#f2f20d] hover:underline transition-all">@localheros_sportscards</a>
        </p>

        <div class="flex gap-6 text-2xl text-slate-400">
          <a href="https://www.instagram.com/localheros_sportscards/" target="_blank" title="Instagram">
            <i class="fa-brands fa-instagram transition-colors duration-300"></i>
          </a>
          <a href="https://x.com/jdiegorceli1?s=21" target="_blank" title="X (Twitter)">
            <i class="fa-brands fa-x-twitter transition-colors duration-300"></i>
          </a>
          <a href="https://www.facebook.com/share/wwXIfr" target="_blank" title="Facebook">
            <i class="fa-brands fa-facebook transition-colors duration-300"></i>
          </a>
        </div>

        <!-- ✅ Cookie settings link -->
        <div class="text-[11px] text-slate-500 font-bold">
          <span class="cookie-link" id="cookie-manage">Manage cookies</span>
        </div>
      </div>
    </section>

    <div class="search-container">
      <input type="text" id="athleteSearch" onkeyup="filterBySearch()"
             placeholder="Search active athletes..." class="search-input">
    </div>

    <div id="athletes-grid" class="grid grid-cols-1 md:grid-cols-4 gap-8"></div>

    <div class="footer-banner-spacer"></div>
  </main>

  <!-- ✅ COOKIE BANNER -->
  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
    <div class="text-sm font-black mb-1">Cookies</div>
    <div class="text-xs text-slate-300 leading-relaxed">
      We use cookies to measure traffic and improve the site. You can accept or decline.
    </div>
    <div class="cookie-actions">
      <button id="cookie-decline" class="cookie-btn" type="button">Decline</button>
      <button id="cookie-accept" class="cookie-btn cookie-btn-accept" type="button">Accept</button>
    </div>
  </div>

  <!-- EBAY AFFILIATE FOOTER BANNER -->
  <footer class="ebay-footer">
    <a
      href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
      target="_blank"
      rel="noopener noreferrer"
      title="Shop Trading Cards on eBay"
    >
      <img
        src="./assets/Baseball-728x90.jpg"
        alt="Collect more. Spend less. Shop Trading Cards on eBay."
        class="ebay-banner-img"
        loading="eager"
      />
    </a>
  </footer>

  <script>
    // -------------------------
    // ✅ Cookie banner logic + Google Consent Mode updates
    // -------------------------
    (function () {
      const KEY = "vzla_cookie_consent_v1"; // accepted | declined
      const banner = document.getElementById("cookie-banner");
      const btnAccept = document.getElementById("cookie-accept");
      const btnDecline = document.getElementById("cookie-decline");
      const btnManage = document.getElementById("cookie-manage");

      function setConsent(granted) {
        const v = granted ? "granted" : "denied";
        if (typeof gtag === "function") {
          gtag("consent", "update", {
            ad_storage: v,
            ad_user_data: v,
            ad_personalization: v,
            analytics_storage: v
          });
        }
      }

      function save(choice) {
        try { localStorage.setItem(KEY, choice); } catch (e) {}
      }
      function load() {
        try { return localStorage.getItem(KEY); } catch (e) { return null; }
      }

      const existing = load();
      if (!existing) {
        banner.style.display = "block";
      } else {
        setConsent(existing === "accepted");
      }

      btnAccept.addEventListener("click", () => {
        save("accepted");
        setConsent(true);
        banner.style.display = "none";
      });

      btnDecline.addEventListener("click", () => {
        save("declined");
        setConsent(false);
        banner.style.display = "none";
      });

      // "Manage cookies" => show banner again
      if (btnManage) {
        btnManage.addEventListener("click", () => {
          banner.style.display = "block";
        });
      }
    })();

    // -------------------------
    // App logic (your existing code)
    // -------------------------

    // Fallback list (used if data/athletes.json can't be loaded)
    const athleteDataRaw = [
      { name: "Ronald Acuña Jr.", sport: "Baseball", league: "MLB", team: "Braves" },
      { name: "Jackson Chourio", sport: "Baseball", league: "MLB", team: "Brewers" },
      { name: "Maikel Garcia", sport: "Baseball", league: "MLB", team: "Royals" },
      { name: "Salvador Perez", sport: "Baseball", league: "MLB", team: "Royals" },
      { name: "Eugenio Suárez", sport: "Baseball", league: "MLB", team: "Diamondbacks" },
      { name: "Jose Altuve", sport: "Baseball", league: "MLB", team: "Astros" },
      { name: "Luis Arraez", sport: "Baseball", league: "MLB", team: "Padres" },
      { name: "William Contreras", sport: "Baseball", league: "MLB", team: "Brewers" },
      { name: "Anthony Santander", sport: "Baseball", league: "MLB", team: "Orioles" },
      { name: "Wilyer Abreu", sport: "Baseball", league: "MLB", team: "Red Sox" },
      { name: "Eduardo Rodriguez", sport: "Baseball", league: "MLB", team: "Diamondbacks" },
      { name: "Francisco Alvarez", sport: "Baseball", league: "MLB", team: "Mets" },

      { name: "Yeferson Soteldo", sport: "Soccer", league: "Serie A", team: "Grêmio" },
      { name: "Jon Aramburu", sport: "Soccer", league: "La Liga", team: "Real Sociedad" },
      { name: "Nahuel Ferraresi", sport: "Soccer", league: "Série A", team: "São Paulo" },
      { name: "Cristian Cásseres Jr.", sport: "Soccer", league: "Ligue 1", team: "Toulouse" },
      { name: "Telasco Segovia", sport: "Soccer", league: "Primeira Liga", team: "Casa Pia" },
      { name: "Jefferson Savarino", sport: "Soccer", league: "Série A", team: "Botafogo" },
      { name: "David Martínez", sport: "Soccer", league: "MLS", team: "LAFC" },

      { name: "Michael Carrera", sport: "Basketball", league: "LEB Oro", team: "Estudiantes" },
      { name: "Heissler Guillent", sport: "Basketball", league: "LNBP", team: "Astros" },
      { name: "David Cubillan", sport: "Basketball", league: "SLB", team: "Trotamundos" },
      { name: "Jose Ascanio", sport: "Basketball", league: "Liga Nacional", team: "Oberá" },
      { name: "Pedro Chourio", sport: "Basketball", league: "NBB", team: "São José" },

      { name: "Jhonattan Vegas", sport: "Golf", league: "PGA", team: "Venezuela" },
      { name: "Garbiñe Muguruza", sport: "Tennis", league: "WTA", team: "Venezuela" },
      { name: "Marlon Vera", sport: "MMA", league: "UFC", team: "Venezuela" },
      { name: "Andres Borregales", sport: "Football", league: "NFL", team: "New England Patriots" }
    ];

    let athleteData = [];
    let currentSport = 'All';

    const icons = {
      'Baseball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 40 Q 50 60 70 40 M30 60 Q 50 40 70 60" fill="none" stroke="#121212" stroke-width="2"/>`,
      'Soccer': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M50 20 L60 40 L80 45 L65 60 L70 80 L50 70 L30 80 L35 60 L20 45 L40 40 Z" fill="#121212"/>`,
      'Basketball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M20 50 L80 50 M50 20 L50 80 M25 30 Q 50 50 25 70 M75 30 Q 50 50 75 70" fill="none" stroke="#121212" stroke-width="2"/>`,
      'Golf': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><circle cx="50" cy="50" r="5" fill="#121212"/>`,
      'Tennis': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M35 35 Q 50 50 65 35 M35 65 Q 50 50 65 65" fill="none" stroke="#121212" stroke-width="2"/>`,
      'MMA': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 30 L70 70 M70 30 L30 70" stroke="#121212" stroke-width="4"/>`,
      'Football': `<ellipse cx="50" cy="50" rx="35" ry="20" fill="#f2f20d" stroke="#121212" stroke-width="2"/>`,
      'Hockey': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M35 65 Q50 75 65 65" fill="none" stroke="#121212" stroke-width="3"/><circle cx="50" cy="50" r="6" fill="#121212"/>`,
      'Rugby': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 50 Q50 30 70 50 Q50 70 30 50" fill="none" stroke="#121212" stroke-width="3"/>`,
      'Volleyball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 35 Q50 50 70 35 M30 65 Q50 50 70 65 M50 20 Q60 50 50 80" fill="none" stroke="#121212" stroke-width="2"/>`
    };

    // ✅ Deduplicate by (name + sport + league + team)
    function dedupeAthletes(list) {
      const norm = (v) => (v || "").toString().trim().toLowerCase();
      const map = new Map();

      for (const a of (list || [])) {
        const name = (a && a.name) ? a.name : "Unknown";
        const sport = (a && a.sport) ? a.sport : "Other";
        const league = (a && a.league) ? a.league : "";
        const team = (a && a.team) ? a.team : "Unknown";

        const key = `${norm(name)}|${norm(sport)}|${norm(league)}|${norm(team)}`;
        if (!map.has(key)) map.set(key, { name, sport, league, team });
      }

      return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
    }

    // Merge fallback + fetched, prefer fetched if it has better team/league fields
    function mergeAthletes(fallbackList, fetchedList) {
      const norm = (v) => (v || "").toString().trim().toLowerCase();

      const byName = new Map();
      for (const a of (fallbackList || [])) {
        const k = norm(a.name);
        if (!k) continue;
        byName.set(k, { name: a.name || "Unknown", sport: a.sport || "Other", league: a.league || "", team: a.team || "Unknown" });
      }

      for (const a of (fetchedList || [])) {
        const k = norm(a.name);
        if (!k) continue;

        const incoming = { name: a.name || "Unknown", sport: a.sport || "Other", league: a.league || "", team: a.team || "Unknown" };
        if (!byName.has(k)) {
          byName.set(k, incoming);
          continue;
        }

        const cur = byName.get(k);
        const curTeam = norm(cur.team);
        const newTeam = norm(incoming.team);
        const curHasTeam = curTeam && curTeam !== "unknown";
        const newHasTeam = newTeam && newTeam !== "unknown";

        if (!curHasTeam && newHasTeam) byName.set(k, incoming);
        else {
          const curLeague = norm(cur.league);
          const newLeague = norm(incoming.league);
          if (!curLeague && newLeague) byName.set(k, { ...cur, league: incoming.league, team: incoming.team, sport: incoming.sport });
        }
      }

      return dedupeAthletes(Array.from(byName.values()));
    }

    async function init() {
      let fetched = [];
      try {
        const res = await fetch(`./data/athletes.json?v=${Date.now()}`, { cache: "no-store" });
        if (res.ok) fetched = await res.json();
      } catch (e) {}

      const fetchedNormalized = Array.isArray(fetched)
        ? fetched.map(a => ({
            name: a.name || "Unknown",
            sport: a.sport || "Other",
            league: a.league || "",
            team: a.team || "Unknown"
          }))
        : [];

      athleteData = mergeAthletes(athleteDataRaw, fetchedNormalized);
      renderGrid(athleteData);
    }

    function filterBySearch() {
      const query = (document.getElementById('athleteSearch').value || "").toLowerCase();
      const filtered = athleteData.filter(a => {
        const matchesQuery = (a.name || "").toLowerCase().includes(query);

        let matchesSport = false;
        if (currentSport === 'All') matchesSport = true;
        else if (currentSport === 'Other') {
          const mainSports = ['Baseball', 'Soccer', 'Basketball'];
          matchesSport = !mainSports.includes(a.sport);
        } else matchesSport = (a.sport === currentSport);

        return matchesQuery && matchesSport;
      });
      renderGrid(filtered);
    }

    function setSport(sport, btn) {
      currentSport = sport;
      document.querySelectorAll('#sport-filters button')
        .forEach(b => b.classList.replace('text-[#f2f20d]', 'text-slate-500'));
      btn.classList.replace('text-slate-500', 'text-[#f2f20d]');
      filterBySearch();
    }

    function renderGrid(data) {
      const grid = document.getElementById('athletes-grid');
      const campID = "5339142321";
      const rotationID = "706-53473-19255-0";

      grid.innerHTML = (data || []).map(a => {
        const ebaySearchURL =
          `https://www.ebay.ca/sch/i.html?_nkw=${encodeURIComponent(a.name)}&mkevt=1&mkcid=1&mkrid=${rotationID}&campid=${campID}&toolid=10001`;
        const icon = icons[a.sport] || icons['Baseball'];

        return `
          <div class="athlete-card">
            <div class="sport-icon-wrapper">
              <svg viewBox="0 0 100 100" class="w-16 h-16 mx-auto">${icon}</svg>
              <div class="indicator-bar">
                <div class="active-segment"></div>
                <div class="inactive-segment"></div>
              </div>
            </div>
            <div class="bg-[#f2f20d] text-black text-[9px] font-black px-2 py-1 rounded mb-3 inline-block">ELITE TIER</div>
            <h3 class="text-2xl font-black italic uppercase leading-tight mb-1">${a.name}</h3>
            <div class="flex justify-center items-center gap-1 mb-6">
              <span class="status-dot"></span>
              <span class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">${a.sport} • ${a.team}</span>
            </div>
            <a href="${ebaySearchURL}" target="_blank"
              class="block w-full bg-[#f2f20d] text-black py-3 rounded-xl font-black text-xs hover:scale-[1.02] transition-transform">
              SHOP COLLECTIBLES
            </a>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
