<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Elite Tracker | Venezuela</title>
    
    <script>window._epn = {campaign: 5339142321};</script>
    <script src="https://epnt.ebay.com/static/epn-smart-tools.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2f20d",
                        "background-dark": "#121212",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                },
            },
        }
    </script>
    <style>
        body { background-color: #0a0a0a; font-family: 'Inter', sans-serif; }
        .athlete-card {
            background: #121212;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(242, 242, 13, 0.1);
            transition: all 0.3s ease;
        }
        .athlete-card:hover { transform: translateY(-5px); border-color: rgba(242, 242, 13, 0.4); }
        .sport-icon-wrapper {
            background: rgba(242, 242, 13, 0.03);
            border-radius: 24px;
            padding: 35px;
            margin-bottom: 24px;
            border: 1px solid rgba(242, 242, 13, 0.15);
        }
        .athlete-name { font-style: italic; text-transform: uppercase; letter-spacing: -0.5px; }
        .indicator-bar { display: flex; gap: 4px; justify-content: center; margin-top: 15px; }
        .active-segment { width: 28px; height: 5px; background: #f2f20d; border-radius: 3px; }
        .inactive-segment { width: 14px; height: 5px; background: #2a2a2a; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

    <nav class="p-6 border-b border-white/5 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <h1 class="text-2xl font-black italic uppercase tracking-tighter">
                🇻🇪 Elite <span class="text-primary">Tracker</span>
            </h1>
            <div class="flex gap-4" id="sport-filters">
                <button onclick="setSport('All', this)" class="text-xs font-black uppercase text-primary">All</button>
                <button onclick="setSport('Baseball', this)" class="text-xs font-black uppercase text-slate-500">Baseball</button>
                <button onclick="setSport('Soccer', this)" class="text-xs font-black uppercase text-slate-500">Soccer</button>
                <button onclick="setSport('Basketball', this)" class="text-xs font-black uppercase text-slate-500">Basketball</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8">
        <div id="athletes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
    </main>

    <script>
        let athleteData = [];
        let currentSport = 'All';

        const icons = {
            'Baseball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 40 Q 50 60 70 40 M30 60 Q 50 40 70 60" fill="none" stroke="#121212" stroke-width="2"/>`,
            'Soccer': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M50 20 L60 40 L80 45 L65 60 L70 80 L50 70 L30 80 L35 60 L20 45 L40 40 Z" fill="#121212"/>`,
            'Basketball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M20 50 L80 50 M50 20 L50 80 M25 30 Q 50 50 25 70 M75 30 Q 50 50 75 70" fill="none" stroke="#121212" stroke-width="2"/>`
        };

        async function init() {
            try {
                const resp = await fetch('data/athletes.json');
                athleteData = await resp.json();
                renderGrid(athleteData);
            } catch (e) { console.error(e); }
        }

        function setSport(sport, btn) {
            currentSport = sport;
            document.querySelectorAll('#sport-filters button').forEach(b => b.classList.replace('text-primary', 'text-slate-500'));
            btn.classList.replace('text-slate-500', 'text-primary');
            filterContent();
        }

        function filterContent() {
            const filtered = athleteData.filter(a => currentSport === 'All' || a.sport === currentSport);
            renderGrid(filtered);
        }

        function renderGrid(data) {
            const grid = document.getElementById('athletes-grid');
            grid.innerHTML = data.map(a => `
                <div class="athlete-card group">
                    <div class="sport-icon-wrapper">
                        <svg viewBox="0 0 100 100" class="w-16 h-16 mx-auto">
                            ${icons[a.sport] || icons['Baseball']}
                        </svg>
                        <div class="indicator-bar">
                            <div class="active-segment"></div>
                            <div class="inactive-segment"></div>
                        </div>
                    </div>

                    <div class="bg-primary text-black text-[10px] font-black px-3 py-1 rounded-full inline-block mb-3">ELITE TIER</div>
                    
                    <h3 class="athlete-name text-2xl font-black text-white mb-1 leading-tight">
                        ${a.name}
                    </h3>
                    
                    <div class="text-primary text-[11px] font-bold uppercase tracking-wider mb-6">
                        ${a.sport} • ${a.team}
                    </div>

                    <div class="grid grid-cols-3 gap-2 mb-6 border-t border-white/10 pt-4">
                        <div>
                            <span class="block text-[10px] text-slate-500 font-bold mb-1">RANK</span>
                            <span class="text-lg font-black italic text-white">--</span>
                        </div>
                        <div class="border-x border-white/5">
                            <span class="block text-[10px] text-slate-500 font-bold mb-1">STATUS</span>
                            <span class="text-lg font-black italic text-white">ACT</span>
                        </div>
                        <div>
                            <span class="block text-[10px] text-slate-500 font-bold mb-1">EXP</span>
                            <span class="text-lg font-black italic text-white">--</span>
                        </div>
                    </div>

                    <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(a.name)}" target="_blank" 
                       class="w-full bg-primary py-4 rounded-xl font-black text-black text-sm flex items-center justify-center gap-2 hover:shadow-[0_4px_20px_rgba(242,242,13,0.4)] transition-all">
                        SHOP COLLECTIBLES
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </a>
                </div>
            `).join('');
        }
        init();
    </script>
</body>
</html>
