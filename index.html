<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>VZLA Sports Elite</title>

  <!-- Google Tag Manager -->
  <script>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MMQ86CNB');
  </script>

  <link rel="stylesheet" href="./dist/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --vzla-yellow:#f2f20d;
      --bg:#0a0a0a;
      --panel:rgba(255,255,255,0.05);
      --stroke:rgba(255,255,255,0.08);
      --muted:rgba(148,163,184,0.85);
      --shadow:0 20px 60px rgba(0,0,0,0.55);
    }

    body{
      background-color: var(--bg);
      font-family:'Inter', sans-serif;
      color:#fff;
    }

    /* =========================
       LAYOUT (SIDE BANNERS)
       ========================= */
    .page-shell{
      display:grid;
      grid-template-columns: 210px 1fr 210px;
      gap: 22px;
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 14px;
    }
    @media (max-width: 1280px){
      .page-shell{ grid-template-columns: 180px 1fr 180px; }
    }
    @media (max-width: 1100px){
      .page-shell{ grid-template-columns: 1fr; }
    }

    .side-banner{
      position: sticky;
      top: 92px;
      height: fit-content;
      display:flex;
      justify-content:center;
    }
    @media (max-width: 1100px){
      .side-banner{ display:none; }
    }

    .side-banner img{
      width: 180px;
      max-width: 100%;
      height: auto;
      border-radius: 22px;
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      transition: transform 0.18s ease;
      filter: saturate(0.95) contrast(1.02);
    }
    .side-banner img:hover{ transform: scale(1.01); }

    /* =========================
       SEARCH
       ========================= */
    .search-container{
      position:relative;
      width:100%;
      max-width: 460px;
      margin: 0 auto 2rem;
    }

    .search-input{
      width:100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 12px 18px;
      border-radius: 999px;
      color:#fff;
      font-size: 14px;
      outline:none;
    }
    .search-input:focus{
      border-color: var(--vzla-yellow);
      box-shadow: 0 0 12px rgba(242,242,13,0.12);
    }

    /* =========================
       ATHLETE CARDS
       ========================= */
    .athlete-card{
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
      border-radius: 30px;
      padding: 18px 18px 16px;
      text-align:center;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 18px 45px rgba(0,0,0,0.5);
      transition: transform 0.18s ease, border-color 0.18s ease;
      overflow:hidden;
      position:relative;
      min-height: 250px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .athlete-card:hover{
      transform: translateY(-4px);
      border-color: rgba(242,242,13,0.35);
    }

    .elite-pill{
      display:inline-block;
      background: var(--vzla-yellow);
      color:#000;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      border-radius: 999px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(242,242,13,0.12);
      margin: 2px auto 14px;
    }

    .athlete-name{
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 10px;
      word-break: break-word;
      font-size: clamp(18px, 2.2vw, 28px);
    }

    .status-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .status-dot{
      height: 10px;
      width: 10px;
      border-radius: 999px;
      background: #00C848;
      box-shadow: 0 0 12px rgba(0,200,72,0.25);
      flex: 0 0 auto;
    }

    .status-text{
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .shop-btn{
      display:block;
      width:100%;
      background: var(--vzla-yellow);
      color:#000;
      font-weight: 800;
      border-radius: 18px;
      padding: 14px 14px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.14s ease;
      line-height: 1.2;
    }
    .shop-btn:hover{ transform: scale(1.02); }

    /* =========================
       FOOTER BANNER
       ========================= */
    .footer-banner-spacer{ height: 120px; }
    @media (max-width: 768px){ .footer-banner-spacer{ height: 105px; } }

    .ebay-footer{
      position: fixed;
      left:0; right:0; bottom:0;
      z-index:9999;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display:flex;
      justify-content:center;
      padding: 10px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateZ(0);
    }

    .ebay-banner-img{
      width: min(970px, 96vw);
      height:auto;
      border-radius: 12px;
      display:block;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.18s ease;
      max-height: 72px;
      object-fit: contain;
    }
    @media (max-width: 480px){
      .ebay-banner-img{ max-height: 56px; width: 96vw; }
    }
    .ebay-banner-img:hover{ transform: scale(1.01); }
  </style>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MMQ86CNB"
      height="0" width="0" style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="bg-[#f2f20d] text-black px-6 py-2 flex justify-between items-center text-[10px] font-black uppercase tracking-tighter">
    <span>© 2026 VZLA Sports Elite</span>
  </header>

  <nav class="p-6 border-b border-white/5 flex items-center justify-between sticky top-0 bg-black/80 backdrop-blur-md z-50">
    <h1 class="text-xl font-black italic">🇻🇪</h1>
    <div class="flex gap-4 text-[10px] font-black uppercase tracking-widest px-2 md:px-0" id="sport-filters">
      <button onclick="setSport('All', this)" class="text-[#f2f20d]">All</button>
      <button onclick="setSport('Baseball', this)" class="text-slate-500">Baseball</button>
      <button onclick="setSport('Soccer', this)" class="text-slate-500">Soccer</button>
      <button onclick="setSport('Basketball', this)" class="text-slate-500">Basketball</button>
      <button onclick="setSport('Other', this)" class="text-slate-500">Other</button>
    </div>
  </nav>

  <div class="page-shell">
    <!-- LEFT SIDE BANNER -->
    <aside class="side-banner">
      <a
        href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
        target="_blank" rel="noopener noreferrer"
        title="Shop Trading Cards on eBay"
      >
        <img src="./assets/ebay-300x600-left.jpg" alt="Shop Trading Cards on eBay">
      </a>
    </aside>

    <!-- CENTER CONTENT -->
    <main class="max-w-7xl mx-auto w-full p-8">
      <section class="text-center mb-8 p-12 bg-white/5 rounded-3xl border border-white/10">
        <h2 class="text-5xl font-black mb-4 uppercase leading-tight">
          VZLA <span class="text-[#f2f20d] italic">Top Tier Sport</span> Talent
          <br>
          <span class="text-3xl lowercase font-bold text-slate-300">search for their memorabilia</span>
        </h2>

        <div class="flex flex-col items-center gap-4">
          <p class="text-slate-400 font-bold">
            by <a href="https://www.ebay.ca/str/localherossportscards?mkcid=1&mkrid=706-53473-19255-0&siteid=2&campid=5339142305&customid=&toolid=10001&mkevt=1"
                  target="_blank"
                  class="text-[#f2f20d] hover:underline transition-all">@localheros_sportscards</a>
          </p>

          <div class="flex gap-6 text-2xl text-slate-400">
            <a href="https://www.instagram.com/localheros_sportscards/" target="_blank" title="Instagram">
              <i class="fa-brands fa-instagram transition-colors duration-300"></i>
            </a>
            <a href="__TWITTER_URL__" target="_blank" title="X (Twitter)">
              <i class="fa-brands fa-x-twitter transition-colors duration-300"></i>
            </a>
            <a href="https://www.facebook.com/share/18NzEJirJZ/?mibextid=wwXIfr" target="_blank" title="Facebook">
              <i class="fa-brands fa-facebook transition-colors duration-300"></i>
            </a>
          </div>
        </div>
      </section>

      <div class="search-container">
        <input type="text" id="athleteSearch" onkeyup="filterBySearch()"
              placeholder="Search athletes..." class="search-input">
      </div>

      <!-- Responsive grid: 1 col mobile, 2 cols md, 3 cols xl -->
      <div id="athletes-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8"></div>

      <div class="footer-banner-spacer"></div>
    </main>

    <!-- RIGHT SIDE BANNER -->
    <aside class="side-banner">
      <a
        href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
        target="_blank" rel="noopener noreferrer"
        title="Shop Trading Cards on eBay"
      >
        <img src="./assets/ebay-300x600-right.jpg" alt="Shop Trading Cards on eBay">
      </a>
    </aside>
  </div>

  <!-- EBAY AFFILIATE FOOTER BANNER -->
  <footer class="ebay-footer">
    <a
      href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
      target="_blank" rel="noopener noreferrer"
      title="Shop Trading Cards on eBay"
    >
      <img
        src="./assets/Baseball-728x90.jpg"
        alt="Collect more. Spend less. Shop Trading Cards on eBay."
        class="ebay-banner-img"
        loading="eager"
      />
    </a>
  </footer>

  <!-- ✅ IMPORTANT: Tailwind must scan classes in ./js/app.js -->
  <script src="./js/app.js"></script>
</body>
</html>
