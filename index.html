<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Athlete Tracker</title>
    <script>window._epn = {campaign: 5339142321};</script>
    <script src="https://epnt.ebay.com/static/epn-smart-tools.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #0033a0; --accent-color: #ffcc00; }
        .hero { background: linear-gradient(135deg, var(--primary-color), #001e5a); color: white; padding: 3rem 0; }
        .card-athlete { border: none; border-radius: 12px; transition: 0.3s; }
        .card-athlete:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-ebay { background-color: var(--accent-color); font-weight: 600; border: none; }
    </style>
</head>
<body>

<header class="hero text-center">
    <div class="container">
        <h1>🇻🇪 Elite Athlete Tracker</h1>
        <p>Tracking talent in MLB, NBA & International Soccer</p>
    </div>
</header>

<main class="container my-4">
    <div class="card p-3 mb-4 shadow-sm border-0">
        <div class="row g-3">
            <div class="col-md-6">
                <input type="text" id="searchBar" class="form-control" placeholder="Search by name, team, or sport..." onkeyup="filterContent()">
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group" id="sport-filters">
                    <button class="btn btn-outline-primary active" onclick="setSport('All', this)">All</button>
                    <button class="btn btn-outline-primary" onclick="setSport('Baseball', this)">Baseball</button>
                    <button class="btn btn-outline-primary" onclick="setSport('Soccer', this)">Soccer</button>
                </div>
            </div>
        </div>
    </div>
    <div id="grid-view" class="row g-4"></div>
</main>

<script>
let athleteData = [];
let currentSport = 'All';

async function init() {
    try {
        const resp = await fetch('data/athletes.json');
        athleteData = await resp.json();
        filterContent();
    } catch (e) { console.error("Error loading data", e); }
}

function setSport(sport, btn) {
    currentSport = sport;
    document.querySelectorAll('#sport-filters .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterContent();
}

function filterContent() {
    const term = document.getElementById('searchBar').value.toLowerCase();
    const filtered = athleteData.filter(a => {
        const matchSport = currentSport === 'All' || a.sport === currentSport;
        // Search matches name, team, OR sport
        const matchTerm = a.name.toLowerCase().includes(term) || 
                          a.team.toLowerCase().includes(term) || 
                          a.sport.toLowerCase().includes(term);
        return matchSport && matchTerm;
    });
    renderGrid(filtered);
}

function renderGrid(data) {
    const grid = document.getElementById('grid-view');
    grid.innerHTML = data.map(a => `
        <div class="col-md-4">
            <div class="card card-athlete h-100 shadow-sm">
                <img src="${a.img}" class="card-img-top" style="height:200px; object-fit:cover;" alt="${a.name}">
                <div class="card-body text-center">
                    <h5 class="fw-bold">${a.name}</h5>
                    <p class="text-muted small">${a.sport} | ${a.team}</p>
                    <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(a.name)}" target="_blank" class="btn btn-ebay w-100">
                        Shop Collectibles
                    </a>
                </div>
            </div>
        </div>
    `).join('');
}
init();
</script>
</body>
</html>
