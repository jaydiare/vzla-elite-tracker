<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VZLA Sports Elite</title>

  <link rel="stylesheet" href="./dist/tailwind.css?v=2026">

  <style>
    :root{
      --vzla-yellow:#f2f20d;
      --vzla-bg:#050505;
      --vzla-panel:#0b0b0b;
    }

    body{
      background: var(--vzla-bg);
      color:#fff;
      min-height:100vh;
    }

    .page-shell{
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px 18px 120px;
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 22px;
      align-items: start;
    }

    /* ✅ UPDATED: allow stacked banners */
    .side-banner{
      position: sticky;
      top: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px; /* space between stacked banners */

      max-height: calc(100vh - 140px); /* leave room for header/nav */
      overflow-y: auto;
      padding-bottom: 10px;

      /* optional: hide scrollbar but keep scrolling */
      scrollbar-width: thin;
    }

    .side-banner::-webkit-scrollbar{
      width: 6px;
    }

    .side-banner::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
    }

    .side-banner img{
      width: 100%;
      max-width: 240px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      transition: transform 0.2s ease;
    }

    .side-banner img:hover{
      transform: scale(1.02);
    }

    @media (max-width: 1024px){
      .page-shell{ grid-template-columns: 1fr; }
      .side-banner{ display:none; }
    }

    .footer-banner-spacer{ height: 105px; }
    @media (min-width: 768px){ .footer-banner-spacer{ height: 95px; } }

    .ebay-footer{
      position: fixed;
      left:0; right:0; bottom:0;
      z-index:9999;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display:flex;
      justify-content:center;
      padding: 10px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    .ebay-banner-img{
      width: min(900px, 96vw);
      height: auto;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
  </style>
</head>

<body>

  <div class="page-shell">

    <!-- ✅ LEFT SIDE BANNERS -->
    <aside class="side-banner">

      <!-- eBay Banner -->
      <a href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
         target="_blank" rel="noopener noreferrer"
         title="Shop Trading Cards on eBay">
        <img src="./assets/ebay-300x600-left.jpg"
             alt="Shop Trading Cards on eBay">
      </a>

      <!-- BCW Banner -->
      <a href="https://www.bcwsupplies.com/?acc=vzlaelite"
         target="_blank" rel="noopener noreferrer"
         title="BCW - Protect, Store, Display">
        <img src="./assets/BCW_774x712.jpg"
             alt="BCW - Protect, Store, Display">
      </a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto w-full p-8">
      <!-- Your existing hero / grid content stays here -->
      <div id="athletes-grid"></div>
    </main>


    <!-- ✅ RIGHT SIDE BANNERS -->
    <aside class="side-banner">

      <!-- eBay Banner -->
      <a href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
         target="_blank" rel="noopener noreferrer"
         title="Shop Trading Cards on eBay">
        <img src="./assets/ebay-300x600-right.jpg"
             alt="Shop Trading Cards on eBay">
      </a>

      <!-- BCW Banner -->
      <a href="https://www.bcwsupplies.com/?acc=vzlaelite"
         target="_blank" rel="noopener noreferrer"
         title="BCW - Protect, Store, Display">
        <img src="./assets/BCW_774x712.jpg"
             alt="BCW - Protect, Store, Display">
      </a>

    </aside>

  </div>

  <footer class="ebay-footer">
    <a href="https://www.ebay.ca/sch/i.html?_nkw=trading+cards&mkevt=1&mkcid=1&mkrid=706-53473-19255-0&campid=5339142321&toolid=10001"
       target="_blank" rel="noopener noreferrer">
      <img src="./assets/Baseball-728x90.jpg"
           alt="eBay banner"
           class="ebay-banner-img"/>
    </a>
  </footer>

  <script src="./js/app.js" defer></script>

</body>
</html>
