<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Elite Tracker | Venezuela</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
    <style>
        body { background-color: #0a0a0a; font-family: 'Inter', sans-serif; color: white; }
        .athlete-card {
            background: #121212; border-radius: 20px; padding: 24px; text-align: center;
            border: 1px solid rgba(242, 242, 13, 0.1); transition: all 0.3s ease;
        }
        .sport-icon-wrapper {
            background: rgba(242, 242, 13, 0.03); border-radius: 24px;
            padding: 35px; margin-bottom: 24px; border: 1px solid rgba(242, 242, 13, 0.15);
        }
        /* Search Bar Styling */
        .search-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto 2rem; }
        .search-input {
            width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 12px 20px;
            border-radius: 50px; color: white; font-size: 14px; outline: none;
        }
        .search-input:focus { border-color: #f2f20d; box-shadow: 0 0 10px rgba(242, 242, 13, 0.2); }
        .indicator-bar { display: flex; gap: 4px; justify-content: center; margin-top: 15px; }
        .active-segment { width: 28px; height: 5px; background: #f2f20d; border-radius: 3px; }
        .inactive-segment { width: 14px; height: 5px; background: #2a2a2a; border-radius: 3px; }
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-active { background: #00C848; }
        .dot-retired { background: #ce1126; }
    </style>
</head>
<body>
    <nav class="p-6 border-b border-white/5 flex items-center justify-between sticky top-0 bg-black/80 backdrop-blur-md z-50">
        <h1 class="text-xl font-black italic">🇻🇪 Elite <span class="text-[#f2f20d]">Tracker</span></h1>
        <div class="flex gap-4 text-[10px] font-black uppercase tracking-widest" id="sport-filters">
            <button onclick="setSport('All', this)" class="text-[#f2f20d]">All</button>
            <button onclick="setSport('Baseball', this)" class="text-slate-500">Baseball</button>
            <button onclick="setSport('Soccer', this)" class="text-slate-500">Soccer</button>
            <button onclick="setSport('Basketball', this)" class="text-slate-500">Basketball</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-8">
        <section class="text-center mb-8 p-12 bg-white/5 rounded-3xl border border-white/10">
            <h2 class="text-5xl font-black mb-4 uppercase leading-tight">Track The <span class="text-[#f2f20d] italic">Top Tier</span> Talent In Real-Time</h2>
            
            <p class="text-slate-400 font-bold">
                by <a href="https://www.ebay.ca/str/localherossportscards" target="_blank" class="text-[#f2f20d] hover:underline transition-all">@localheros_sportscards</a>
            </p>
        </section>

        <div class="search-container">
            <input type="text" id="athleteSearch" onkeyup="filterBySearch()" placeholder="Search athlete by name..." class="search-input">
        </div>

        <div id="athletes-grid" class="grid grid-cols-1 md:grid-cols-4 gap-8"></div>
    </main>

    <script>
        let athleteData = [];
        let currentSport = 'All';

        const icons = {
            'Baseball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M30 40 Q 50 60 70 40 M30 60 Q 50 40 70 60" fill="none" stroke="#121212" stroke-width="2"/>`,
            'Soccer': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M50 20 L60 40 L80 45 L65 60 L70 80 L50 70 L30 80 L35 60 L20 45 L40 40 Z" fill="#121212"/>`,
            'Basketball': `<circle cx="50" cy="50" r="30" fill="#f2f20d"/><path d="M20 50 L80 50 M50 20 L50 80 M25 30 Q 50 50 25 70 M75 30 Q 50 50 75 70" fill="none" stroke="#121212" stroke-width="2"/>`
        };

        async function init() {
            try {
                const resp = await fetch('data/athletes.json');
                athleteData = await resp.json();
                renderGrid(athleteData);
            } catch(e) { console.error("Data load failed", e); }
        }

        // Search Functionality
        function filterBySearch() {
            const query = document.getElementById('athleteSearch').value.toLowerCase();
            const filtered = athleteData.filter(a => 
                (currentSport === 'All' || a.sport === currentSport) && 
                a.name.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        }

        function setSport(sport, btn) {
            currentSport = sport;
            document.querySelectorAll('#sport-filters button').forEach(b => b.classList.replace('text-[#f2f20d]', 'text-slate-500'));
            btn.classList.replace('text-slate-500', 'text-[#f2f20d]');
            filterBySearch();
        }

        function renderGrid(data) {
            const grid = document.getElementById('athletes-grid');
            grid.innerHTML = data.map(a => {
                // Retirement check for legacy legends
                const isRetired = a.name.includes("Miguel Cabrera");
                const statusLabel = isRetired ? "RETIRED / LEGEND" : "ACTIVE";
                const statusClass = isRetired ? "dot-retired" : "dot-active";

                return `
                <div class="athlete-card">
                    <div class="sport-icon-wrapper">
                        <svg viewBox="0 0 100 100" class="w-16 h-16 mx-auto">${icons[a.sport] || icons['Baseball']}</svg>
                        <div class="indicator-bar"><div class="active-segment"></div><div class="inactive-segment"></div></div>
                    </div>
                    <div class="bg-[#f2f20d] text-black text-[9px] font-black px-2 py-1 rounded mb-3 inline-block">ELITE TIER</div>
                    <h3 class="text-2xl font-black italic uppercase leading-tight mb-1">${a.name}</h3>
                    <div class="flex justify-center items-center gap-1 mb-6">
                        <span class="status-dot ${statusClass}"></span>
                        <span class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">${a.sport} • ${statusLabel}</span>
                    </div>
                    <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(a.name)}" target="_blank" class="block w-full bg-[#f2f20d] text-black py-3 rounded-xl font-black text-xs hover:shadow-[0_4px_15px_rgba(242,242,13,0.4)] transition-all">SHOP COLLECTIBLES</a>
                </div>`;
            }).join('');
        }
        init();
    </script>
</body>
</html>
