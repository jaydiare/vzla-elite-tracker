<script>
  function mergeAthletes(seedList, fetchedList) {
    const norm = (v) => (v || "").toString().trim().toLowerCase();

    // Priority: fetched data wins over seed; within fetched, prefer "better" sport buckets
    const sportPriority = (sport) => {
      const s = norm(sport);
      if (s === "baseball") return 1;
      if (s === "soccer") return 2;
      if (s === "basketball") return 3;
      return 9; // Other
    };

    const pickBetter = (a, b) => {
      // prefer record that has a real team
      const aTeam = norm(a.team);
      const bTeam = norm(b.team);
      const aHasTeam = aTeam && aTeam !== "unknown";
      const bHasTeam = bTeam && bTeam !== "unknown";
      if (aHasTeam !== bHasTeam) return bHasTeam ? b : a;

      // prefer one with a known league
      const aLeague = norm(a.league);
      const bLeague = norm(b.league);
      const aHasLeague = aLeague && aLeague !== "unknown";
      const bHasLeague = bLeague && bLeague !== "unknown";
      if (aHasLeague !== bHasLeague) return bHasLeague ? b : a;

      // prefer main sports over Other
      const ap = sportPriority(a.sport);
      const bp = sportPriority(b.sport);
      if (ap !== bp) return bp < ap ? b : a;

      // otherwise keep existing
      return a;
    };

    const map = new Map();

    // load seed first
    for (const a of seedList) {
      const key = norm(a.name);
      if (!key) continue;
      map.set(key, {
        name: a.name || "Unknown",
        sport: a.sport || "Other",
        league: a.league || "",
        team: a.team || "Unknown"
      });
    }

    // overlay fetched (wins when duplicate by name)
    for (const a of fetchedList) {
      const key = norm(a.name);
      if (!key) continue;

      const normalized = {
        name: a.name || "Unknown",
        sport: a.sport || "Other",
        league: a.league || "",
        team: a.team || "Unknown"
      };

      if (!map.has(key)) {
        map.set(key, normalized);
      } else {
        map.set(key, pickBetter(map.get(key), normalized));
      }
    }

    return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name));
  }
</script>
