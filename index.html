<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Elite Tracker | Venezuela</title>
    
    <script>window._epn = {campaign: 5339142321};</script>
    <script src="https://epnt.ebay.com/static/epn-smart-tools.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2f20d",
                        "background-dark": "#121208",
                        "ven-blue": "#00247d",
                        "ven-red": "#ce1126",
                    },
                    fontFamily: { "display": ["Inter", "sans-serif"] }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .athlete-card-gradient { background: linear-gradient(145deg, #1e1e0a 0%, #121208 100%); }
        .glass-nav { background: rgba(18, 18, 8, 0.8); backdrop-filter: blur(12px); }
        .hero-pattern { background-image: radial-gradient(circle at 2px 2px, rgba(242, 242, 13, 0.05) 1px, transparent 0); background-size: 24px 24px; }
    </style>
</head>
<body class="bg-background-dark font-display text-slate-100 min-h-screen">

    <nav class="fixed top-0 w-full z-50 glass-nav border-b border-white/5">
        <div class="max-w-[1440px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-12">
                <div class="flex items-center gap-3">
                    <div class="bg-primary text-background-dark p-1.5 rounded-lg">
                        <span class="material-symbols-outlined block">star_half</span>
                    </div>
                    <h1 class="text-xl font-extrabold tracking-tighter uppercase italic">
                        🇻🇪 Elite <span class="text-primary">Tracker</span>
                    </h1>
                </div>
                <div class="hidden lg:flex items-center gap-1" id="sport-filters">
                    <button onclick="setSport('All', this)" class="px-4 py-2 rounded-lg bg-primary/10 text-primary font-bold text-sm border border-primary/20">All Sports</button>
                    <button onclick="setSport('Baseball', this)" class="px-4 py-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors font-medium text-sm">Baseball</button>
                    <button onclick="setSport('Soccer', this)" class="px-4 py-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors font-medium text-sm">Soccer</button>
                    <button onclick="setSport('Basketball', this)" class="px-4 py-2 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors font-medium text-sm">Basketball</button>
                </div>
            </div>
            <div class="flex items-center bg-white/5 border border-white/10 rounded-full px-4 py-2 w-64">
                <span class="material-symbols-outlined text-slate-400 text-sm">search</span>
                <input id="searchBar" onkeyup="filterContent()" class="bg-transparent border-none focus:ring-0 text-sm w-full placeholder:text-slate-500" placeholder="Quick search..." type="text"/>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 max-w-[1440px] mx-auto">
        <section class="relative mb-16 rounded-3xl overflow-hidden border border-white/5 bg-slate-900/40 p-12 hero-pattern text-center">
            <span class="inline-block py-1 px-3 rounded-full bg-primary/10 text-primary text-xs font-bold uppercase tracking-widest mb-6 border border-primary/20">
                Venezuela's Finest Athletes
            </span>
            <h2 class="text-4xl md:text-6xl font-black mb-2 leading-[1.1] tracking-tight">
                Track The <span class="text-primary italic">Top Tier</span> Talent In Real-Time
            </h2>
            
            <p class="text-slate-400 text-sm font-bold mb-6">
                by 
                <a target="_blank" 
                   href="https://www.ebay.ca/str/localherossportscards?mkcid=1&mkrid=706-53473-19255-0&siteid=2&campid=5339142305&customid=&toolid=10001&mkevt=1" 
                   class="text-primary hover:underline transition-all">
                   @loacalheros_sportscards
                </a>
            </p>

            <p class="text-slate-400 text-lg mb-10 max-w-xl mx-auto">
                Global database for scouting, analytics, and career tracking of Venezuela's elite sports professionals.
            </p>

            <img style="text-decoration:none;border:0;padding:0;margin:0;position:absolute;visibility:hidden;" 
                 src="https://www.ebayadservices.com/marketingtracking/v1/impression?mpt=3030369&mkcid=1&mkrid=706-53473-19255-0&mkevt=2&siteid=2&campid=5339142305&ad_type=0&toolid=10001">
        </section>

        <div class="flex items-center justify-between mb-8">
            <h3 class="text-2xl font-black flex items-center gap-3">
                <span class="w-2 h-8 bg-primary rounded-full"></span> Featured Athletes
            </h3>
        </div>

        <div id="athletes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </main>

    <script>
        let athleteData = [];
        let currentSport = 'All';

        async function init() {
            try {
                const resp = await fetch('data/athletes.json');
                athleteData = await resp.json();
                renderGrid(athleteData);
            } catch (e) { console.error("Error loading athletes", e); }
        }

        function setSport(sport, btn) {
            currentSport = sport;
            document.querySelectorAll('#sport-filters button').forEach(b => {
                b.classList.remove('bg-primary/10', 'text-primary', 'border-primary/20');
                b.classList.add('text-slate-400');
            });
            btn.classList.add('bg-primary/10', 'text-primary', 'border-primary/20');
            filterContent();
        }

        function filterContent() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = athleteData.filter(a => {
                const matchSport = currentSport === 'All' || a.sport === currentSport;
                const matchTerm = a.name.toLowerCase().includes(term) || a.team.toLowerCase().includes(term);
                return matchSport && matchTerm;
            });
            renderGrid(filtered);
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
        }

        function renderGrid(data) {
            const grid = document.getElementById('athletes-grid');
            grid.innerHTML = data.map(a => {
                const initials = getInitials(a.name);
                return `
                <div class="athlete-card-gradient border border-white/10 p-1 rounded-2xl group hover:border-primary/40 transition-all duration-300">
                    <div class="relative bg-background-dark/80 rounded-xl p-6 h-full flex flex-col overflow-hidden">
                        
                        <div class="aspect-square mb-6 overflow-hidden rounded-lg border border-white/5 relative bg-white/5 flex items-center justify-center">
                            <span class="absolute inset-0 flex items-center justify-center text-4xl font-black text-white/10 select-none">
                                ${initials}
                            </span>
                            <img src="${a.img}" alt="${a.name}"
                                 class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 relative z-10"
                                 onerror="this.style.display='none'; this.parentElement.classList.add('bg-gradient-to-br', 'from-ven-blue/20', 'to-ven-red/20')">
                            
                            <div class="absolute top-2 left-2 z-20">
                                 <span class="px-2 py-0.5 bg-black/60 backdrop-blur-md border border-white/10 rounded text-[9px] font-bold text-primary italic uppercase tracking-widest">
                                    ${a.league}
                                 </span>
                            </div>
                        </div>

                        <div class="mb-6 relative z-10">
                            <p class="text-slate-500 text-[10px] font-bold mb-1 uppercase tracking-tighter">${a.sport} | ${a.team}</p>
                            <h4 class="text-3xl font-black tracking-tight leading-tight group-hover:text-primary transition-colors">
                                ${a.name.split(' ')[0]} <br/> ${a.name.split(' ').slice(1).join(' ')}
                            </h4>
                        </div>

                        <div class="grid grid-cols-3 gap-2 mb-8 border-t border-b border-white/5 py-4 relative z-10">
                            <div class="text-center">
                                <p class="text-[9px] text-slate-500 font-bold mb-1">RANK</p>
                                <p class="text-base font-black italic">--</p>
                            </div>
                            <div class="text-center border-x border-white/5">
                                <p class="text-[9px] text-slate-500 font-bold mb-1">STATUS</p>
                                <p class="text-base font-black italic">Active</p>
                            </div>
                            <div class="text-center">
                                <p class="text-[9px] text-slate-500 font-bold mb-1">EXP</p>
                                <p class="text-base font-black italic">--</p>
                            </div>
                        </div>

                        <div class="mt-auto">
                            <a href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(a.name)}" target="_blank" 
                               class="block w-full bg-primary py-3 rounded-lg font-black text-background-dark text-center text-xs hover:shadow-[0_4px_15px_rgba(242,242,13,0.4)] transition-all">
                                VIEW COLLECTIBLES
                            </a>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        init();
    </script>
</body>
</html>
