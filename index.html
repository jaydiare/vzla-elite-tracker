  <style>
    :root{
      --vzla-yellow:#f2f20d;
      --bg:#0a0a0a;
      --panel:rgba(255,255,255,0.05);
      --stroke:rgba(255,255,255,0.08);
      --muted:rgba(148,163,184,0.85);
      --shadow:0 20px 60px rgba(0,0,0,0.55);
    }

    body{
      background-color: var(--bg);
      font-family:'Inter', sans-serif;
      color:#fff;
    }

    /* =========================
       LAYOUT (SIDE BANNERS)
       ========================= */
    .page-shell{
      display:grid;
      grid-template-columns: 210px 1fr 210px;
      gap: 22px;
      max-width: 1500px;
      margin: 0 auto;
      padding: 0 14px;
    }
    @media (max-width: 1280px){
      .page-shell{ grid-template-columns: 180px 1fr 180px; }
    }
    @media (max-width: 1100px){
      .page-shell{ grid-template-columns: 1fr; }
    }

    .side-banner{
      position: sticky;
      top: 92px;
      height: fit-content;
      display:flex;
      justify-content:center;
    }
    @media (max-width: 1100px){
      .side-banner{ display:none; }
    }

    .side-banner img{
      width: 180px;
      max-width: 100%;
      height: auto;
      border-radius: 22px;
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      transition: transform 0.18s ease;
      filter: saturate(0.95) contrast(1.02);
    }
    .side-banner img:hover{ transform: scale(1.01); }

    /* =========================
       SEARCH
       ========================= */
    .search-container{
      position:relative;
      width:100%;
      max-width: 460px;
      margin: 0 auto 2rem;
    }

    .search-input{
      width:100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 12px 18px;
      border-radius: 999px;
      color:#fff;
      font-size: 14px;
      outline:none;
    }
    .search-input:focus{
      border-color: var(--vzla-yellow);
      box-shadow: 0 0 12px rgba(242,242,13,0.12);
    }

    /* =========================
       ATHLETE CARDS
       ========================= */
    .athlete-card{
      background: radial-gradient(circle at top, rgba(255,255,255,0.08), rgba(0,0,0,0.25));
      border-radius: 30px;
      padding: 18px 18px 16px;
      text-align:center;
      border: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 18px 45px rgba(0,0,0,0.5);
      transition: transform 0.18s ease, border-color 0.18s ease;
      overflow:hidden;
      position:relative;
      min-height: 250px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .athlete-card:hover{
      transform: translateY(-4px);
      border-color: rgba(242,242,13,0.35);
    }

    .elite-pill{
      display:inline-block;
      background: var(--vzla-yellow);
      color:#000;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 6px 14px;
      border-radius: 999px;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(242,242,13,0.12);
      margin: 2px auto 14px;
    }

    /* FIXED: this block was broken in your last file */
    .athlete-name{
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 10px;
      word-break: break-word;
      font-size: clamp(18px, 2.2vw, 28px);
    }

    .status-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .status-dot{
      height: 10px;
      width: 10px;
      border-radius: 999px;
      background: #00C848;
      box-shadow: 0 0 12px rgba(0,200,72,0.25);
      flex: 0 0 auto;
    }

    .status-text{
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .shop-btn{
      display:block;
      width:100%;
      background: var(--vzla-yellow);
      color:#000;
      font-weight: 800;
      border-radius: 18px;
      padding: 14px 14px;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.14s ease;
    }
    .shop-btn:hover{ transform: scale(1.02); }

    /* =========================
       FOOTER BANNER
       ========================= */
    .footer-banner-spacer{ height: 120px; }
    @media (max-width: 768px){ .footer-banner-spacer{ height: 105px; } }

    .ebay-footer{
      position: fixed;
      left:0; right:0; bottom:0;
      z-index:9999;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display:flex;
      justify-content:center;
      padding: 10px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      transform: translateZ(0);
    }

    .ebay-banner-img{
      width: min(970px, 96vw);
      height:auto;
      border-radius: 12px;
      display:block;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.18s ease;
      max-height: 72px;
      object-fit: contain;
    }
    @media (max-width: 480px){
      .ebay-banner-img{ max-height: 56px; width: 96vw; }
    }
    .ebay-banner-img:hover{ transform: scale(1.01); }
  </style>
</head>

<body>

  <script>
    // FULL fixed fallback list (exactly as you pasted)
    const athleteDataRaw = [
      { name: "Ronald Acuña Jr.", sport: "Baseball", league: "MLB", team: "Braves" },
      { name: "Jackson Chourio", sport: "Baseball", league: "MLB", team: "Brewers" },
      { name: "Maikel Garcia", sport: "Baseball", league: "MLB", team: "Royals" },
      { name: "Salvador Perez", sport: "Baseball", league: "MLB", team: "Royals" },
      { name: "Eugenio Suárez", sport: "Baseball", league: "MLB", team: "Diamondbacks" },
      { name: "Jose Altuve", sport: "Baseball", league: "MLB", team: "Astros" },
      { name: "Luis Arraez", sport: "Baseball", league: "MLB", team: "Padres" },
      { name: "William Contreras", sport: "Baseball", league: "MLB", team: "Brewers" },
      { name: "Anthony Santander", sport: "Baseball", league: "MLB", team: "Orioles" },
      { name: "Wilyer Abreu", sport: "Baseball", league: "MLB", team: "Red Sox" },
      { name: "Eduardo Rodriguez", sport: "Baseball", league: "MLB", team: "Diamondbacks" },
      { name: "Francisco Alvarez", sport: "Baseball", league: "MLB", team: "Mets" },

      { name: "Yeferson Soteldo", sport: "Soccer", league: "Serie A", team: "Grêmio" },
      { name: "Jon Aramburu", sport: "Soccer", league: "La Liga", team: "Real Sociedad" },
      { name: "Nahuel Ferraresi", sport: "Soccer", league: "Série A", team: "São Paulo" },
      { name: "Cristian Cásseres Jr.", sport: "Soccer", league: "Ligue 1", team: "Toulouse" },
      { name: "Telasco Segovia", sport: "Soccer", league: "Primeira Liga", team: "Casa Pia" },
      { name: "Jefferson Savarino", sport: "Soccer", league: "Série A", team: "Botafogo" },
      { name: "David Martínez", sport: "Soccer", league: "MLS", team: "LAFC" },

      { name: "Michael Carrera", sport: "Basketball", league: "LEB Oro", team: "Estudiantes" },
      { name: "Heissler Guillent", sport: "Basketball", league: "LNBP", team: "Astros" },
      { name: "David Cubillan", sport: "Basketball", league: "SLB", team: "Trotamundos" },
      { name: "Jose Ascanio", sport: "Basketball", league: "Liga Nacional", team: "Oberá" },
      { name: "Pedro Chourio", sport: "Basketball", league: "NBB", team: "São José" },

      { name: "Jhonattan Vegas", sport: "Golf", league: "PGA", team: "Venezuela" },
      { name: "Garbiñe Muguruza", sport: "Tennis", league: "WTA", team: "Venezuela" },
      { name: "Marlon Vera", sport: "MMA", league: "UFC", team: "Venezuela" },
      { name: "Andres Borregales", sport: "Football", league: "NFL", team: "New England Patriots" },
      { name: "Amleto Monacelli", sport: "Bowling", league: "PBA50", team: "Unknown" }
    ];

    let athleteData = [];
    let currentSport = "All";

    // Dedupe by (name + sport + league + team)
    function dedupeAthletes(list) {
      const norm = (v) => (v || "").toString().trim().toLowerCase();
      const map = new Map();

      for (const a of (list || [])) {
        const name  = a?.name  || "Unknown";
        const sport = a?.sport || "Other";
        const league= a?.league|| "";
        const team  = a?.team  || "Unknown";
        const key = `${norm(name)}|${norm(sport)}|${norm(league)}|${norm(team)}`;
        if (!map.has(key)) map.set(key, { name, sport, league, team });
      }

      return Array.from(map.values()).sort((a,b) => a.name.localeCompare(b.name));
    }

    function combineFixedAndFetched(fixedList, fetchedList) {
      const fetchedNormalized = Array.isArray(fetchedList)
        ? fetchedList.map(a => ({
            name: a?.name || "Unknown",
            sport: a?.sport || "Other",
            league: a?.league || "",
            team: a?.team || "Unknown"
          }))
        : [];

      return dedupeAthletes([...(fixedList || []), ...fetchedNormalized]);
    }

    async function fetchAthletesJsonWithFallback() {
      const cacheBust = `v=${Date.now()}`;

      const origins = Array.from(new Set([
        window.location.origin,
        window.location.origin.replace("://www.", "://"),
        window.location.origin.includes("://www.")
          ? window.location.origin
          : window.location.origin.replace("://", "://www.")
      ]));

      const paths = origins.map(o => `${o}/data/athletes.json?${cacheBust}`);
      // Also try relative as last resort (works on GitHub Pages)
      paths.push(`./data/athletes.json?${cacheBust}`);

      for (const url of paths) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (res.ok) return await res.json();
        } catch (e) {}
      }
      return null;
    }

    async function init() {
      const fetched = await fetchAthletesJsonWithFallback();
      athleteData = combineFixedAndFetched(athleteDataRaw, fetched);
      renderGrid(athleteData);
    }

    function filterBySearch() {
      const query = (document.getElementById("athleteSearch").value || "").toLowerCase();

      const filtered = athleteData.filter(a => {
        const matchesQuery = (a.name || "").toLowerCase().includes(query);

        let matchesSport = false;
        if (currentSport === "All") matchesSport = true;
        else if (currentSport === "Other") {
          const mainSports = ["Baseball","Soccer","Basketball"];
          matchesSport = !mainSports.includes(a.sport);
        } else matchesSport = (a.sport === currentSport);

        return matchesQuery && matchesSport;
      });

      renderGrid(filtered);
    }

    function setSport(sport, btn) {
      currentSport = sport;
      document.querySelectorAll("#sport-filters button")
        .forEach(b => b.classList.replace("text-[#f2f20d]", "text-slate-500"));
      btn.classList.replace("text-slate-500", "text-[#f2f20d]");
      filterBySearch();
    }

    function renderGrid(data) {
      const grid = document.getElementById("athletes-grid");
      const campID = "5339142321";
      const rotationID = "706-53473-19255-0";

      grid.innerHTML = (data || []).map(a => {
        const ebaySearchURL =
          `https://www.ebay.ca/sch/i.html?_nkw=${encodeURIComponent(a.name)}&mkevt=1&mkcid=1&mkrid=${rotationID}&campid=${campID}&toolid=10001`;

        return `
          <div class="athlete-card">
            <div>
              <div class="elite-pill">ELITE TIER</div>
              <h3 class="athlete-name">${a.name}</h3>

              <div class="status-row">
                <span class="status-dot"></span>
                <span class="status-text">${a.sport} • ${a.team}</span>
              </div>
            </div>

            <a href="${ebaySearchURL}" target="_blank" class="shop-btn">
              SHOP COLLECTIBLES
            </a>
          </div>
        `;
      }).join("");
    }

    init();
  </script>
